plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monitorceldas.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.monitorceldas.app'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // Llave fija (solo de desarrollo) para que cada APK nuevo se instale encima del anterior
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
