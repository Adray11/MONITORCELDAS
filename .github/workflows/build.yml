name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MonitorCeldas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorCeldas-apk
          path: MonitorCeldas.apk

      - name: Publicar en Releases (descarga directa desde el celular)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest MonitorCeldas.apk \
            --title "MonitorCeldas (build ${{ github.run_number }})" \
            --notes "APK generado automáticamente desde el commit ${{ github.sha }}." \
            --prerelease --target ${{ github.sha }}
